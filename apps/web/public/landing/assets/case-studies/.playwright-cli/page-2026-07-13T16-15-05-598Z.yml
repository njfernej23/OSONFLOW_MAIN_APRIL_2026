                - generic [ref=e636]: +
              - paragraph [ref=e637]: Voice queries undergo real-time speech-to-text translation and are routed identically to chat. The AI forms a grounded textual answer that's translated back into natural synthesized audio in under 380ms.
            - generic [ref=e638]:
              - button "Are my workspace files shared or leaked? +" [ref=e639] [cursor=pointer]:
                - text: Are my workspace files shared or leaked?
                - generic [ref=e640]: +
              - paragraph [ref=e641]: Never. All indexed files and uploads are sandboxed inside partitioned local storage vectors. Your data is isolated and never used to train global public LLM models.
            - generic [ref=e642]:
