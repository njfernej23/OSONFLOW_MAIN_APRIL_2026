                - generic [ref=e631]: +
              - paragraph [ref=e633]: Osonflow intercepts conversation prompts and appends your custom knowledge as text variables. If an inquiry can't be answered from that grounded text, it gracefully flags the thread for human hand-off instead of guessing.
            - generic [ref=e634]:
