                - generic [ref=f3e617]: +
              - paragraph [ref=f3e619]: Osonflow intercepts conversation prompts and appends your custom knowledge as text variables. If an inquiry can't be answered from that grounded text, it gracefully flags the thread for human hand-off instead of guessing.
            - generic [ref=f3e620]:
              - button "What is bidirectional voice routing? +" [ref=f3e621] [cursor=pointer]:
                - text: What is bidirectional voice routing?
                - generic [ref=f3e622]: +
              - paragraph [ref=f3e623]: Voice queries undergo real-time speech-to-text translation and are routed identically to chat. The AI forms a grounded textual answer that's translated back into natural synthesized audio in under 380ms.
            - generic [ref=f3e624]:
              - button "Are my workspace files shared or leaked? +" [ref=f3e625] [cursor=pointer]:
                - text: Are my workspace files shared or leaked?
                - generic [ref=f3e626]: +
              - paragraph [ref=f3e627]: Never. All indexed files and uploads are sandboxed inside partitioned local storage vectors. Your data is isolated and never used to train global public LLM models.
            - generic [ref=f3e628]:
              - button "How does manual takeover / escalation work? +" [ref=f3e629] [cursor=pointer]:
                - text: How does manual takeover / escalation work?
                - generic [ref=f3e630]: +
              - paragraph [ref=f3e631]: Every thread tracks confidence scoring. If a visitor requests a human, or Osonflow registers a low-confidence answer, it dispatches a persistent notification. Agents assume control instantly with the complete context.
