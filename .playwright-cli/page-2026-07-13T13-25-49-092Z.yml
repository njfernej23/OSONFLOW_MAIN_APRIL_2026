                - generic [ref=f4e622]: +
              - paragraph [ref=f4e623]: Voice queries undergo real-time speech-to-text translation and are routed identically to chat. The AI forms a grounded textual answer that's translated back into natural synthesized audio in under 380ms.
            - generic [ref=f4e624]:
